name: Install Orbit 3.2 Fluid UI (verified release)
on:
  push:
    paths:
      - ".github/workflows/install-orbit-3-2.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install-orbit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout existing site
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch and verify complete Orbit 3.2 package
        env:
          SOURCE_URL: "https://at.adobe.com/mtCUtSKhZ0KKZzek"
          EXPECTED_SHA256: "8d4f7872452b2a169ae0496da6b03a2b9c5222999f0fc11da7ef881f1228848e"
        run: |
          set -euo pipefail
          curl --fail --location --show-error --retry 3 --max-time 180 --output /tmp/orbit32.zip "$SOURCE_URL"
          printf '%s  %s\n' "$EXPECTED_SHA256" /tmp/orbit32.zip | sha256sum --check
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          from stat import S_IFMT, S_IFLNK
          src=Path('/tmp/orbit32.zip')
          dst=Path('/tmp/orbit32-stage')
          dst.mkdir(exist_ok=True)
          with ZipFile(src) as z:
              names=set()
              for info in z.infolist():
                  name=info.filename
                  path=PurePosixPath(name)
                  assert name and not name.startswith('/') and '..' not in path.parts, name
                  assert name not in names, name
                  assert not S_IFMT(info.external_attr >> 16)==S_IFLNK, name
                  assert info.file_size < 5_000_000, name
                  names.add(name)
              assert z.testzip() is None, 'Corrupted ZIP member'
              z.extractall(dst)
          required=['index.html','fluid.css','orbit-core.css','gesture-rig.css','fluid-ui.js',
                    'appearance-studio.js','app.js','orbit-store.js','orbit-behavior.js',
                    'offline-brain.js','service-worker.js','manifest.webmanifest',
                    'assets/orbit-robot.png','README.md','TEST_REPORT.md','ROLLBACK.md']
          for name in required:
              assert (dst/name).is_file(),name
          index=(dst/'index.html').read_text(encoding='utf-8')
          sw=(dst/'service-worker.js').read_text(encoding='utf-8')
          assert 'appearance-studio.js' in index and 'fluid-ui.js' in index
          assert 'orbit-gesture-rig' in index
          assert 'orbit-shell-v3.2.0' in sw
          assert 'orbit-core.css' in sw and 'fluid.css' in sw
          assert 'orbit-mobile.prototype' not in index
          assert len(list(dst.rglob('*'))) >= len(required)
          PY
      - name: Install only Orbit and commit one complete update
        run: |
          set -euo pipefail
          mkdir -p orbit
          rm -f orbit/styles.css orbit/rework.css orbit/hd-motion.css orbit/v3.css
          cp -a /tmp/orbit32-stage/. orbit/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A orbit/
          if ! git diff --cached --quiet; then
            git commit -m "Orbit 3.2: fluid minimal UI, appearance studio, HD companion and iOS input fix"
            git push origin HEAD:main
          fi
