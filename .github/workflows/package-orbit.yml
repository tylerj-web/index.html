name: Publish Orbit Mobile download
on:
  push:
    paths:
      - ".github/workflows/package-orbit.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest deployed Orbit
        uses: actions/checkout@v4
      - name: Build portable Orbit ZIP
        run: |
          mkdir -p downloads
          (cd orbit && zip -q -r ../downloads/Orbit-Mobile-v2.4.zip . -x '*.DS_Store')
          python3 - <<'PY'
          import zipfile
          f='downloads/Orbit-Mobile-v2.4.zip'
          with zipfile.ZipFile(f) as z:
              assert z.testzip() is None
              names=set(z.namelist())
              for key in ['index.html','app.js','offline-brain.js','orbit-behavior.js','rework.css','service-worker.js','manifest.webmanifest','assets/orbit-robot.png']:
                  assert key in names,key
              print('Validated',len(names),'files')
          PY
      - name: Publish ZIP on the existing GitHub Pages site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/Orbit-Mobile-v2.4.zip
          if ! git diff --cached --quiet; then
            git commit -m "Publish downloadable Orbit Mobile v2.4 ZIP"
            git push
          fi
