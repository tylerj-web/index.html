name: Install Orbit Mobile PWA
on:
  push:
    paths:
      - ".github/workflows/install-orbit.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install-orbit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout existing site
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and verify Orbit 3.0 release
        env:
          ORBIT_SOURCE: "https://at.adobe.com/FscjXb7hoM2JNiIO"
          EXPECTED_SHA256: "3be96e92b7673697f666d3cb821b325c798ed68d130ead95b3dd089683b3b093"
        run: |
          set -euo pipefail
          curl --fail --show-error --location --retry 3 --max-time 200 --output /tmp/orbit-v3.zip "$ORBIT_SOURCE"
          printf '%s  %s\n' "$EXPECTED_SHA256" /tmp/orbit-v3.zip | sha256sum --check
          python3 - <<'PY'
          import pathlib, zipfile
          dest=pathlib.Path("/tmp/orbit-v3-stage")
          dest.mkdir(exist_ok=True)
          allowed={".js",".css",".html",".md",".webmanifest",".png"}
          with zipfile.ZipFile("/tmp/orbit-v3.zip") as z:
              for entry in z.infolist():
                  p=pathlib.PurePosixPath(entry.filename)
                  if p.is_absolute() or '..' in p.parts or entry.file_size > 10_000_000:
                      raise ValueError("Unsafe archive member: "+entry.filename)
                  if entry.filename and not entry.is_dir() and p.suffix not in allowed:
                      raise ValueError("Unexpected archive type: "+entry.filename)
              z.extractall(dest)
          required=["index.html","app.js","offline-brain.js","orbit-behavior.js","orbit-store.js","service-worker.js","assets/orbit-robot.png"]
          for path in required:
              assert (dest/path).is_file(), "Required file missing: "+path
          PY
          mkdir -p orbit
          rsync -a --delete /tmp/orbit-v3-stage/ orbit/
      - name: Commit verified Orbit release without modifying other sites
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A orbit/
          if ! git diff --cached --quiet; then
            git commit -m "Orbit Mobile 3.0: HD animations, local conversations, inspections, backups"
            git push
          fi
